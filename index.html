<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breaking the Silence — Menstrual Health Awareness</title>  
<meta name="description"
content="Breaking the Silence — a student-led menstrual health awareness project exploring periods, hygiene, products, myths, health, sustainability, access and community perspectives.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F1E9;
  --paper-dim:#EFE7D8;
  --ink:#211D1A;
  --ink-soft:#5B5450;
  --maroon:#8A1F2B;
  --maroon-deep:#5E1520;
  --gold:#C7962F;
  --sage:#748C74;
  --indigo:#3C4568;
  --line:rgba(33,29,26,0.14);
  --radius:2px;
}
*{
  box-sizing:border-box;
}
html{
  scroll-behavior:smooth;
}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Work Sans',sans-serif;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,.display{
  font-family:'Fraunces',serif;
  font-weight:600;
  line-height:1.08;
  margin:0;
  letter-spacing:-0.01em;
}
a{
  color:inherit;
}
button,
input,
textarea,
select{
  font:inherit;
}
.wrap{
  max-width:1080px;
  margin:0 auto;
  padding:0 28px;
  position:relative;
}
.narrow{
  max-width:680px;
}
#progressBar{
  position:fixed;
  top:0;
  left:0;
  height:3px;
  width:0%;
  background:var(--maroon);
  z-index:999;
  transition:width .08s linear;
}
/* ---------- NAVIGATION ---------- */
nav{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(246,241,233,.94);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
nav .wrap{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding-top:16px;
  padding-bottom:16px;
}
.brand{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:1.05rem;
}
.brand span{
  color:var(--maroon);
}
.navlinks{
  display:flex;
  gap:22px;
  font-size:.82rem;
}
.navlinks a{
  text-decoration:none;
  color:var(--ink-soft);
  padding-bottom:3px;
  position:relative;
}
.navlinks a::after{
  content:'';
  position:absolute;
  left:0;
  bottom:0;
  width:0;
  height:1.5px;
  background:var(--maroon);
  transition:width .25s ease;
}
.navlinks a:hover{
  color:var(--maroon);
}
.navlinks a:hover::after{
  width:100%;
}
.navtoggle{
  display:none;
  background:none;
  border:none;
  font-size:1.4rem;
  cursor:pointer;
  color:var(--ink);
}
@media(max-width:850px){

  .navlinks{
    display:none;
  }

  .navtoggle{
    display:block;
  }
   .navlinks.open{
    display:flex;
    flex-direction:column;
    position:absolute;
    top:64px;
    left:0;
    right:0;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:18px 28px;
    gap:14px;
  }
}/* ---------- FLOATERS ---------- */
.floaters span{
  position:absolute;
  border-radius:50%;
  border:1.5px solid var(--line);
  animation:drift 14s ease-in-out infinite;
  pointer-events:none;
}
.floaters span:nth-child(1){
  width:14px;
  height:14px;
  top:18%;
  left:6%;
  animation-duration:11s;
}
.floaters span:nth-child(2){
  width:8px;
  height:8px;
  top:62%;
  left:14%;
  background:var(--gold);
  border:none;
  opacity:.5;
  animation-duration:9s;
  animation-delay:1s;
}
.floaters span:nth-child(3){
  width:22px;
  height:22px;
  top:30%;
  right:12%;
  animation-duration:16s;
  animation-delay:.5s;
}
.floaters span:nth-child(4){
  width:6px;
  height:6px;
  top:75%;
  right:22%;
  background:var(--maroon);
  border:none;
  opacity:.45;
  animation-duration:8s;
  animation-delay:2s;
}
@keyframes drift{
  0%,100%{
    transform:translateY(0) translateX(0);
  }
  50%{
    transform:translateY(-22px) translateX(10px);
  }
}/* ---------- HERO ---------- */
.hero{
  padding:100px 0 76px;
  position:relative;
  overflow:hidden;
  min-height:650px;
  display:flex;
  align-items:center;
}
.hero .eyebrow{
  font-size:.82rem;
  color:var(--maroon);
  font-weight:600;
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-bottom:22px;
  opacity:0;
  animation:riseIn .7s ease forwards .1s;
}
.eyebrow .dot{
  width:7px;
  height:7px;
  background:var(--maroon);
  border-radius:50%;
  display:inline-block;
}
.hero h1{
  font-size:clamp(2.6rem,6.5vw,5.1rem);
  max-width:820px;
}
.hero h1 .line{
  display:block;
  overflow:hidden;
}
.hero h1 .line span{
  display:block;
  transform:translateY(110%);
  animation:riseIn .8s cubic-bezier(.22,1,.36,1) forwards;
}
.hero h1 .line:nth-child(1) span{
  animation-delay:.15s;
}
.hero h1 .line:nth-child(2) span{
  animation-delay:.3s;
}
@keyframes riseIn{
  from{
    opacity:0;
  }
  to{
    transform:translateY(0);
    opacity:1;
  }
}
.hero .ctas{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  margin-top:38px;
  opacity:0;
  animation:riseIn .7s ease forwards .7s;
}
.btn{
  font-family:'Work Sans',sans-serif;
  font-size:.92rem;
  font-weight:600;
  padding:14px 26px;
  border-radius:var(--radius);
  text-decoration:none;
  display:inline-block;
  border:1.5px solid var(--ink);
  transition:transform .18s ease,background .18s ease,color .18s ease,box-shadow .18s ease;
}
.btn-solid{
  background:var(--maroon);
  color:var(--paper);
  border-color:var(--maroon);
}
.btn-solid:hover{
  background:var(--maroon-deep);
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(138,31,43,.28);
}
.btn-outline{
  background:transparent;
  color:var(--ink);
}
.btn-outline:hover{
  background:var(--ink);
  color:var(--paper);
  transform:translateY(-2px);
}
.hero-note{
  margin-top:16px;
  font-size:.82rem;
  color:var(--ink-soft);
  opacity:0;
  animation:riseIn .7s ease forwards .85s;
}/* ---------- HERO MARK ---------- */
.hero-mark{
  position:absolute;
  right:-70px;
  top:60px;
  width:420px;
  height:420px;
  border:1.5px solid var(--line);
  border-radius:50%;
  opacity:.6;
  transition:transform .1s linear;
}
.hero-mark::before{
  content:'';
  position:absolute;
  inset:28px;
  border:1px dashed var(--line);
  border-radius:50%;
  animation:spinSlow 60s linear infinite;
}
.hero-mark::after{
  content:'';
  position:absolute;
  inset:90px;
  border:1px solid rgba(138,31,43,.16);
  border-radius:50%;
}
@keyframes spinSlow{
  to{
    transform:rotate(360deg);
  }
}
@media(max-width:900px){
  .hero-mark{
    display:none;
  }
}/* ---------- GENERAL SECTIONS ---------- */
section{
  padding:92px 0;
  border-top:1px solid var(--line);
  position:relative;
}
.reveal{
  opacity:0;
  transform:translateY(24px);
  transition:opacity .7s ease,transform .7s ease;
}
.reveal.in{
  opacity:1;
  transform:translateY(0);
}
.section-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:24px;
  margin-bottom:44px;
  flex-wrap:wrap;
}
.section-num{
  font-size:.8rem;
  color:var(--maroon);
  font-weight:600;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:8px;
}
.section-num::before{
  content:'';
  width:0;
  height:1px;
  background:var(--maroon);
  transition:width .6s ease;
}
.reveal.in .section-num::before{
  width:28px;
}
.section-head h2{
  font-size:clamp(1.7rem,3.4vw,2.5rem);
  max-width:560px;
}
.section-head p{
  color:var(--ink-soft);
  max-width:340px;
  font-size:.96rem;
  margin-top:6px;
}/* ---------- STATS ---------- */
.stat-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:1px;
  background:var(--line);
  border:1px solid var(--line);
  margin-top:20px;
}
.stat-cell{
  background:var(--paper);
  padding:30px 22px;
  text-align:left;
  transition:background .25s ease;
}
.stat-cell:hover{
  background:var(--paper-dim);
}
.stat-num{
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:2.5rem;
  color:var(--maroon);
  display:block;
}
.stat-label{
  font-size:.86rem;
  color:var(--ink-soft);
  margin-top:6px;
  display:block;
}
@media(max-width:760px){
  .stat-row{
    grid-template-columns:1fr 1fr;
  }
}
@media(max-width:480px){
  .stat-row{
    grid-template-columns:1fr;
  }
}
/* ---------- CYCLE ---------- */
.cycle-wrap{
  display:grid;
  grid-template-columns:280px 1fr;
  gap:48px;
  align-items:center;
  margin-top:20px;
}
@media(max-width:820px){
  .cycle-wrap{
    grid-template-columns:1fr;
    justify-items:center;
  }
}
.cycle-svg{
  width:260px;
  height:260px;
}
.cycle-svg circle.track{
  fill:none;
  stroke:var(--line);
  stroke-width:2;
}
.cycle-svg .arc{
  fill:none;
  stroke-width:10;
  stroke-linecap:round;
  transform-origin:130px 130px;
  stroke-dasharray:220;
  stroke-dashoffset:220;
  transition:stroke-dashoffset 1.1s ease;
}
.cycle-svg .arc1{
  stroke:var(--maroon);
}
.cycle-svg .arc2{
  stroke:var(--gold);
}
.cycle-svg .arc3{
  stroke:var(--sage);
}
.cycle-svg .arc4{
  stroke:var(--indigo);
}
.reveal.in .cycle-svg .arc{
  stroke-dashoffset:var(--target,0);
}
.cycle-center{
  font-family:'Fraunces',serif;
  font-size:.85rem;
  fill:var(--ink-soft);
}
.cycle-legend{
  display:grid;
  gap:14px;
}
.cycle-legend .item{
  display:flex;
  gap:12px;
  align-items:flex-start;
  font-size:.94rem;
}
.cycle-legend .sw{
  width:12px;
  height:12px;
  border-radius:50%;
  flex-shrink:0;
  margin-top:5px;
}
/* ---------- TWO COLUMN ---------- */
.poverty-wrap{
  display:grid;
  grid-template-columns:1.1fr 1fr;
  gap:48px;
  align-items:start;
}
@media(max-width:820px){
  .poverty-wrap{
    grid-template-columns:1fr;
  }
}

/* ---------- LIST ---------- */
.practice-list{
  list-style:none;
  margin:20px 0 0;
  padding:0;
  display:grid;
  gap:12px;
}
.practice-list li{
  padding-left:26px;
  position:relative;
  font-size:.96rem;
}
.practice-list li::before{
  content:'';
  position:absolute;
  left:0;
  top:8px;
  width:8px;
  height:8px;
  background:var(--gold);
  transition:transform .2s ease;
}
.practice-list li:hover::before{
  transform:scale(1.5);
}/* ---------- TABLE ---------- */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  font-size:.94rem;
}
th,
td{
  text-align:left;
  padding:14px 16px;
  border-bottom:1px solid var(--line);
}
th{
  font-family:'Fraunces',serif;
  font-weight:600;
  color:var(--ink);
  font-size:.98rem;
}
tr{
  transition:background .2s ease;
}
tr:hover{
  background:var(--paper-dim);
}
tr:last-child td{
  border-bottom:none;
}
@media(max-width:650px){
  table{
    display:block;
    overflow-x:auto;
  }
  th,
  td{
    min-width:150px;
  }
}
/* ---------- TILT HOVER ---------- */
.tilt{
  transition:transform .25s ease,box-shadow .25s ease;
}

.tilt:hover{
  transform:translateY(-5px);
  box-shadow:0 14px 28px rgba(33,29,26,.10);
}
/* ---------- PERSPECTIVES ---------- */
.persp-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-top:10px;
}
@media(max-width:900px){
  .persp-grid{
    grid-template-columns:1fr 1fr;
  }
}
@media(max-width:520px){
  .persp-grid{
    grid-template-columns:1fr;
  }
}
.persp-card{
  border:1.5px solid var(--ink);
  background:var(--paper-dim);
  padding:26px 22px;
  min-height:230px;
  display:flex;
  flex-direction:column;
  transition:transform .25s ease,box-shadow .25s ease,background .25s ease;
  position:relative;
  overflow:hidden;
}
.persp-card:hover{
  transform:translateY(-6px);
  box-shadow:0 14px 28px rgba(33,29,26,.12);
  background:#fff;
}
.persp-icon{
  width:38px;
  height:38px;
  margin-bottom:16px;
}
.persp-card h3{
  font-size:1.02rem;
  margin-bottom:10px;
}
.persp-card p{
  font-size:.88rem;
  color:var(--ink-soft);
  margin:0;
  flex-grow:1;
}
.persp-tag{
  position:absolute;
  top:16px;
  right:16px;
  font-size:.68rem;
  color:var(--ink-soft);
  letter-spacing:.03em;
}
.moon-icon{
  position:relative;
  width:34px;
  height:34px;
  border-radius:50%;
  background:var(--indigo);
  overflow:hidden;
}
.moon-icon::after{
  content:'';
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:var(--paper-dim);
  border-radius:50%;
  animation:moonPhase 6s ease-in-out infinite;
}
.tilt-card{
  transition:transform .3s cubic-bezier(.22,1,.36,1), box-shadow .3s ease, background .25s ease !important;
}
.tilt-card:hover{
  transform:translateY(-6px) rotate(-0.4deg) scale(1.015);
  box-shadow:0 16px 32px rgba(33,29,26,0.14);
}
.illo-icon{width:100%;height:100%;}
.illo-icon .draw{
  stroke-dasharray:120;
  stroke-dashoffset:120;
  transition:stroke-dashoffset 1.4s ease;
}
.reveal.in .illo-icon .draw{stroke-dashoffset:0;}
.persp-card:hover .illo-icon .spin-part{
  transition:transform .6s ease;
  transform:rotate(25deg);
  transform-origin:center;
}
.persp-card:hover .illo-icon .pulse-part{
  animation:iconPulse 1s ease-in-out infinite;
}
@keyframes iconPulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.15);}
}
.persp-card:hover .moon-icon::after{
  animation-duration:2.5s;
}
@keyframes moonPhase{
  0%{
    transform:translateX(-100%);
  }
  50%{
    transform:translateX(0%);
  }
  100%{
    transform:translateX(100%);
  }
}
/* ---------- MYTHS ---------- */
.myth-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-top:10px;

@media(max-width:760px){
  .myth-grid{
    grid-template-columns:1fr;
  }
}
.myth-card{
  position:relative;
  border:1.5px solid var(--ink);
  background:var(--paper-dim);
  padding:26px 24px 30px;
  cursor:pointer;
  min-height:160px;
  overflow:hidden;
  transition:background .2s ease,transform .2s ease;
.myth-card:hover{
  background:#fff;
  transform:translateY(-3px);
}
.myth-card .tag{
  font-size:.72rem;
  letter-spacing:.04em;
  color:var(--ink-soft);
  margin-bottom:10px;
  display:block;
}
.myth-card .claim{
  font-family:'Fraunces',serif;
  font-size:1.12rem;
  font-weight:500;
}
.myth-card .fact{
  margin-top:14px;
  font-size:.92rem;
  color:var(--ink-soft);
  max-height:0;
  opacity:0;
  overflow:hidden;
  transition:max-height .4s ease,opacity .3s ease .05s;
}
.myth-card.open .fact{
  max-height:220px;
  opacity:1;
}

.stamp{
  position:absolute;
  top:18px;
  right:18px;
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:.95rem;
  color:var(--maroon);
  border:2.5px solid var(--maroon);
  padding:4px 12px;
  border-radius:3px;
  transform:rotate(8deg) scale(0);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1);
  pointer-events:none;
}
.myth-card.open .stamp{
  transform:rotate(8deg) scale(1);
}
.myth-card .hint{
  position:absolute;
  bottom:14px;
  right:18px;
  font-size:.78rem;
  color:var(--ink-soft);
}

.myth-card.open .hint{
  display:none;
}
.quiz-cta{
  margin-top:36px;
  padding:26px 28px;
  border:1.5px dashed var(--ink);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}
.quiz-cta p{
  margin:0;
  max-width:420px;
  font-size:.95rem;
  color:var(--ink-soft);
}
/* ---------- ALLIES ---------- */
.allies-list{
  list-style:none;
  margin:10px 0 0;
  padding:0;
  display:grid;
}
.allies-list li{
  padding:18px 0;
  border-bottom:1px solid var(--line);
  display:flex;
  gap:16px;
  font-size:1rem;
  transition:padding-left .25s ease;
}
.allies-list li:hover{
  padding-left:10px;
}
.allies-list li:first-child{
  border-top:1px solid var(--line);
}
.allies-list .num{
  font-family:'Fraunces',serif;
  color:var(--sage);
  font-weight:600;
  min-width:26px;
}
.ally-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin-top:10px;
}
@media(max-width:820px){.ally-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:520px){.ally-grid{grid-template-columns:1fr;}}
.ally-card{
  border:1.5px solid var(--ink);
  background:var(--paper-dim);
  padding:24px 20px;
